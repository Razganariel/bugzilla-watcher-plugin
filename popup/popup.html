<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <img src="../icons/icon.svg" alt="Bugzilla" class="logo">
    <div class="title-block">
      <div class="title">Bugzilla Ticket Monitor</div>
      <div class="url" id="url"></div>
    </div>
    <label class="switch" data-i18n-title="popup_switch_title">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="status-row">
    <span class="dot" id="statusDot"></span>
    <span id="statusText" data-i18n="popup_init"></span>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="lastChecked">—</div>
      <div class="stat-label" data-i18n="popup_lastcheck"></div>
    </div>
    <div class="stat">
      <div class="stat-value" id="detectedCount">0</div>
      <div class="stat-label" data-i18n="popup_detections"></div>
    </div>
  </div>

  <button id="checkNow" class="btn" data-i18n="btn_check"></button>

  <div class="filter-row" id="filterRow">
    <button id="filterAll" class="filter-btn active" data-i18n="popup_filter_all"></button>
    <button id="filterNew" class="filter-btn" data-i18n="popup_filter_new"></button>
  </div>

  <div class="section-title" data-i18n="popup_lastsect"></div>
  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" data-i18n="popup_empty"></div>

  <a href="#" id="openOptions" class="link" data-i18n="popup_options"></a>

  <script src="../i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
