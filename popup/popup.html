<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <img src="../icons/icon.svg" alt="Bugzilla" class="logo">
    <div class="title-block">
      <div class="title">Bugzilla Ticket Monitor</div>
      <div class="url" id="url"></div>
    </div>
    <label class="switch" data-i18n-title="popup_switch_title">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="status-row">
    <span class="dot" id="statusDot"></span>
    <span id="statusText" data-i18n="popup_init"></span>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="lastChecked">—</div>
      <div class="stat-label" data-i18n="popup_lastcheck"></div>
    </div>
    <div class="stat">
      <div class="stat-value" id="detectedCount">0</div>
      <div class="stat-label" data-i18n="popup_detections"></div>
    </div>
  </div>

  <div id="sevRow" class="sev-row"></div>

  <button id="checkNow" class="btn" data-i18n="btn_check"></button>

  <div class="filter-row" id="filterRow">
    <button id="filterAll" class="filter-btn active" data-i18n="popup_filter_all"></button>
    <button id="filterNew" class="filter-btn" data-i18n="popup_filter_new"></button>
  </div>

  <div class="section-title" data-i18n="popup_lastsect"></div>
  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" data-i18n="popup_empty"></div>

  <a href="#" id="openOptions" class="link" data-i18n="popup_options"></a>

  <footer class="kofi">
    <a href="https://ko-fi.com/razganariel" target="_blank" rel="noopener noreferrer" class="kofi-link" data-i18n-title="kofi_label">
      <svg class="kofi-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 8h11v5.5a3.5 3.5 0 0 1-3.5 3.5H8.5A3.5 3.5 0 0 1 5 13.5V8z" fill="currentColor"/>
        <path d="M16 9.5h1.2a2.3 2.3 0 1 1 0 4.6H16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M8.5 2.5c0 1-1.2 1-1.2 2.2M11 2.5c0 1-1.2 1-1.2 2.2M13.5 2.5c0 1-1.2 1-1.2 2.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <span data-i18n="kofi_label"></span>
    </a>
  </footer>

  <script src="../i18n.js"></script>
  <script src="../theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
