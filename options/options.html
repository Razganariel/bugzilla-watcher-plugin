<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="wrap">
    <h1>Bugzilla Ticket Monitor</h1>
    <p class="subtitle" data-i18n="opts_subtitle"></p>

    <section>
      <h2 data-i18n="sec_connect"></h2>
      <label><span data-i18n="url_label"></span>
        <input type="text" id="bugzillaUrl" data-i18n-placeholder="url_placeholder"
          data-i18n-title="url_title">
      </label>

      <h3 class="small-h2" data-i18n="auth_title"></h3>
      <div class="row">
        <div class="col">
          <label class="check">
            <input type="radio" name="authMode" value="session"> <span data-i18n="auth_session"></span>
          </label>
        </div>
        <div class="col">
          <label class="check">
            <input type="radio" name="authMode" value="apiKey"> <span data-i18n="auth_apikey"></span>
          </label>
        </div>
      </div>
      <div id="apiKeyBlock" class="hidden">
        <label><span data-i18n="apikey_label"></span>
          <input type="password" id="apiKey" autocomplete="off" data-i18n-placeholder="apikey_placeholder">
        </label>
        <div class="hint" data-i18n="apikey_hint"></div>
      </div>
      <div class="hint" id="sessionHint" data-i18n="session_hint"></div>
    </section>

    <section>
      <h2 data-i18n="sec_polling"></h2>
      <div class="row">
        <div class="col">
          <label><span data-i18n="poll_freq"></span>
            <input type="number" id="pollInterval" min="1" value="1">
          </label>
        </div>
        <div class="col">
          <label><span data-i18n="maxtix_label"></span>
            <input type="number" id="maxTickets" min="1" max="50" value="50">
          </label>
          <div class="hint" data-i18n="maxtix_hint"></div>
        </div>
      </div>
      <label class="check">
        <input type="checkbox" id="baselineFirstRun"> <span data-i18n="baseline_label"></span>
      </label>
    </section>

    <section>
      <h2 data-i18n="sec_lang"></h2>
      <label><span data-i18n="lang_label"></span>
        <select id="lang">
          <option value="auto" data-i18n="lang_auto"></option>
          <option value="fr" data-i18n="lang_fr"></option>
          <option value="en" data-i18n="lang_en"></option>
          <option value="de" data-i18n="lang_de"></option>
          <option value="es" data-i18n="lang_es"></option>
          <option value="it" data-i18n="lang_it"></option>
        </select>
      </label>
      <div class="hint" data-i18n="lang_hint"></div>
    </section>

    <section>
      <h2 data-i18n="sec_criteria"></h2>
      <p class="subtitle" data-i18n="criteria_subtitle"></p>
      <div class="row">
        <div class="col">
          <label><span data-i18n="orderby_label"></span>
            <select id="orderBy">
              <option value="bug_id" data-i18n="orderby_bugid"></option>
              <option value="importance" data-i18n="orderby_importance"></option>
              <option value="changeddate" data-i18n="orderby_changed"></option>
              <option value="creation_time" data-i18n="orderby_created"></option>
            </select>
          </label>
        </div>
        <div class="col">
          <label><span data-i18n="orderdir_label"></span>
            <select id="orderDirection">
              <option value="DESC" data-i18n="orderdir_desc"></option>
              <option value="ASC" data-i18n="orderdir_asc"></option>
            </select>
          </label>
        </div>
      </div>
      <div class="grid" id="criteriaGrid"></div>
    </section>

    <section>
      <h2 data-i18n="sec_advanced"></h2>
      <p class="subtitle" data-i18n="advanced_subtitle"></p>
      <div id="advancedRows"></div>
      <button type="button" id="addAdvanced" class="btn-secondary" data-i18n="btn_add_advanced"></button>
    </section>

    <section>
      <h2 data-i18n="sec_raw"></h2>
      <label><span data-i18n="raw_label"></span>
        <textarea id="rawParams" rows="3" placeholder='{"include_fields":"id,summary","limit":"100"}'></textarea>
      </label>
      <div class="hint" data-i18n="raw_hint"></div>
    </section>

    <section>
      <h2 data-i18n="sec_notify"></h2>
      <div class="row">
        <div class="col">
          <label class="check">
            <input type="checkbox" id="notifyToast"> <span data-i18n="notify_toast"></span>
          </label>
        </div>
        <div class="col">
          <label class="check">
            <input type="checkbox" id="notifySound"> <span data-i18n="notify_sound"></span>
          </label>
        </div>
      </div>
      <label><span data-i18n="sound_url_label"></span>
        <input type="text" id="soundUrl" data-i18n-placeholder="sound_url_placeholder">
      </label>
    </section>

    <div class="actions">
      <button id="test" class="btn-secondary" data-i18n="btn_test"></button>
      <button id="save" class="btn-primary" data-i18n="btn_save"></button>
    </div>
    <div id="msg" class="msg"></div>

    <details class="help">
      <summary data-i18n="help_summary"></summary>
      <ul>
        <li data-i18n="help_l1"></li>
        <li data-i18n="help_l2"></li>
        <li data-i18n="help_l3"></li>
        <li data-i18n="help_l4"></li>
        <li data-i18n="help_l5"></li>
        <li data-i18n="help_l6"></li>
        <li data-i18n="help_l7"></li>
        <li data-i18n="help_l8"></li>
        <li data-i18n="help_l9"></li>
      </ul>
    </details>
  </div>

  <script src="../i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
